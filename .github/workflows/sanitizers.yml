name: Sanitizers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sanitize:
    name: ${{ matrix.runtime }} (ASan+UBSan)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime: [c, cpp]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang

      - name: Configure, build, and test with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          flags="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          build_dir="runtimes/${{ matrix.runtime }}/build-san"
          cmake -S "runtimes/${{ matrix.runtime }}" -B "${build_dir}" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="${flags}" \
            -DCMAKE_CXX_FLAGS="${flags}" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build "${build_dir}" --parallel "$(nproc)"
          ctest --test-dir "${build_dir}" --output-on-failure
